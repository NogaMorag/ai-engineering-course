# Reference only: this is what ai-course/pyproject.toml should look like after
#   uv init --bare --python 3.12
#   uv python pin 3.12
#   uv add "google-genai>=2.28,<3" pydantic
#   uv add --dev pytest ruff
# plus the [tool.pytest.ini_options] block added by hand. Exact minimum versions may differ.

[project]
name = "ai-course"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.28,<3",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
