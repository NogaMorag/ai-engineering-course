# 07:00 Asia/Jerusalem = 04:00 UTC in summer (IDT) and 05:00 UTC in winter (IST). Cron has no timezone, so both lines
# run and the job exits early when it is not 07:00 locally.
name: daily-brief
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v7
      - name: is it 07:00 in Jerusalem? (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=Asia/Jerusalem date +%H)
          if [ "$hour" != "07" ]; then echo "local hour is $hour; skipping"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: astral-sh/setup-uv@v10
        if: env.SKIP != '1'
      - run: uv sync
        if: env.SKIP != '1'
      - name: offline tests first
        if: env.SKIP != '1'
        run: uv run pytest -q -m "not judge"
      - name: restore story memory and store
        if: env.SKIP != '1'
        uses: actions/cache@v6
        with:
          path: |
            data/brief.sqlite
            data/chroma
            data/embeddings-cache.sqlite
          key: morning-brief-data-${{ github.run_id }}
          restore-keys: morning-brief-data-
      - name: run
        if: env.SKIP != '1'
        run: uv run morning-brief run --channels file,email --data-dir data --out out
      - uses: actions/upload-artifact@v7
        if: always() && env.SKIP != '1'
        with:
          name: brief-${{ github.run_id }}
          path: |
            out/
            data/runs/
          retention-days: 14
