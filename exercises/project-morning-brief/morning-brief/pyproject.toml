[project]
name = "morning-brief"
version = "0.1.0"
description = "A scheduled, personalized morning newsletter agent (course capstone)."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.28,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "feedparser>=6",
    "numpy>=2",
    "chromadb>=1.0",
    "jinja2>=3.1",
]

[project.scripts]
morning-brief = "morning_brief.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_brief"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["live: calls the real API; needs a key and --live", "judge: LLM-as-judge evals; nightly"]

[tool.ruff]
line-length = 140
target-version = "py312"
